<meta charset="utf-8">
<title>Flashcards</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="description" content="A mobile, touch-first flashcard app with FSRS spaced repetition. Swipe right if you knew it, left if you didn't, star it if it was easy.">
<meta name="theme-color" content="#f6f7fb">
<meta name="color-scheme" content="light dark">

<!-- Home-screen install -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flashcards">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="css/app.css">

<div id="app">
  <main id="view" class="view" role="main"></main>
</div>

<div id="splash" style="position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:200">
  <div style="text-align:center;color:var(--text-muted)">
    <div style="font-size:2.6rem;margin-bottom:6px">🃏</div>
    <div style="font-size:.9rem;font-weight:600">Flashcards</div>
  </div>
</div>

<noscript>
  <p style="padding:24px;font-family:system-ui;text-align:center">
    This app needs JavaScript — it runs entirely in your browser with no server.
  </p>
</noscript>

<script type="module" src="js/app.js"></script>
